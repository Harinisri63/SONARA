# Development infrastructure: SQL Server 2022 + MinIO (S3-compatible storage)
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set in .env}
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  sqldata:
  miniodata:
